name: Vidéo cocktail (temporaire)
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ tmp-video/run.sh ]
permissions:
  contents: write
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: bash tmp-video/run.sh
      - run: |
          git config user.name magnolia-bot; git config user.email magnolia-bot@users.noreply.github.com
          git add tmp-video/out; git commit -m "Vidéos cocktail candidates"; git pull --rebase && git push
