name: Récupérer la photo de la Lune (NASA)

# Mosaïque de la pleine Lune prise par LRO (NASA Scientific Visualization Studio, domaine public NASA).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/recuperer-lune.yml

permissions:
  contents: write

jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Téléchargement
        run: |
          mkdir -p public/site/lune/source
          cd public/site/lune/source
          for id in 7711844 596134 17302603 7501782 11252554 14993461 11105038 5024217 378556; do curl -fsSL -A "Mozilla/5.0 (magnolia-recuperation)" -o "pexels-$id.jpg" "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1200" || echo "échec $id"; done
          cd -
          ls -la public/site/lune/source
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add public/site/lune
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Photos de la Lune candidates (Pexels)"
          git push
