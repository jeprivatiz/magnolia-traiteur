name: Temporaire - photos brochure 3

on:
  push:
    branches: [claude/project-thread-wrnmqa]
    paths:
      - .github/workflows/tmp-photos3.yml

permissions:
  contents: write

jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-photos && cd tmp-photos
          for id in 35333667 3296277 3979421 17216559 5907620 6287490 28442611; do curl -fsSL -A "Mozilla/5.0 (magnolia-recuperation)" -o "$id.jpg" "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=2000" || echo "échec $id"; done
          ls -la
      - run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add tmp-photos && git commit -m "tmp photos brochure 3" && git push
