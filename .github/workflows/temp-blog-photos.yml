name: Temporaire - photos du blog

# Télécharge des photos Pexels (licence libre) candidates pour les reportages Entreprises du blog.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/temp-blog-photos.yml

permissions:
  contents: write

jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Téléchargement
        run: |
          mkdir -p tmp-blog && cd tmp-blog
          for id in 34774346 1709003 6405679 6405675 6519411 6519213 14524171 29708266 6703915 261014 8761520 8761332 6405665 3171815 16408 3182824 3171837 6759184 6952740 25809255 6914469 7693713 7698747 6519224 6405756; do
            curl -fsSL -A "Mozilla/5.0 (magnolia-recuperation)" -o "$id.jpg" "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=2000" || echo "échec $id"
          done
          ls -la
      - name: Enregistrer
        run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add tmp-blog
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Temporaire : photos candidates du blog"
          git push
