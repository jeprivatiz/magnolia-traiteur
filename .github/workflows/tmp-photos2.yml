name: Temporaire - photos brochure 2

on:
  push:
    branches: [claude/project-thread-wrnmqa]
    paths:
      - .github/workflows/tmp-photos2.yml

permissions:
  contents: write

jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-photos && cd tmp-photos
          for id in 5531479 10978732 35287290 9005432 9271241 17206170 17315458 17023014; do curl -fsSL -A "Mozilla/5.0 (magnolia-recuperation)" -o "$id.jpg" "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=2400" || echo "échec $id"; done
          ls -la
      - run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add tmp-photos && git commit -m "tmp photos brochure 2" && git push
