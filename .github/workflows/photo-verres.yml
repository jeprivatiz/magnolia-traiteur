name: Photo verres (temporaire)
# Outil temporaire : télécharge la photo Pexels 19408256 (verre à vin + flûte) — le cloud ne joint pas Pexels. Retiré avant la fusion.
on:
  push:
    paths:
      - .github/workflows/photo-verres.yml
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p apercu-photos
          curl -sSfL -A "Mozilla/5.0" -o apercu-photos/verres-vin-flute.jpg "https://images.pexels.com/photos/19408256/pexels-photo-19408256.jpeg?auto=compress&cs=tinysrgb&w=1800"
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-photos
          git commit -m "Photo temporaire verres" && git push
