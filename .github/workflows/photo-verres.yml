name: Photos verres (temporaire)
# Outil temporaire : télécharge les photos Pexels 38556967 (verres à vin) et 18573171 (flûtes) — le cloud ne joint pas Pexels. Retiré avant la fusion.
on:
  push:
    paths:
      - .github/workflows/photo-verres.yml
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p apercu-photos
          for id in 38556967 18573171; do curl -sSfL -A "Mozilla/5.0" -o apercu-photos/$id.jpg "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1800"; done
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-photos
          git commit -m "Photos temporaires verres" && git push
