name: Photos Personnel (temporaire)
on:
  push:
    branches: [claude/project-thread-z09rrd]
    paths: [.github/workflows/apercu-photos.yml]
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p apercu-photos
          curl -sSfL -o apercu-photos/pizzaiolo-28857295.jpg "https://images.pexels.com/photos/28857295/pexels-photo-28857295.jpeg?auto=compress&w=2000"
          curl -sSfL -o apercu-photos/regisseur-8815825.jpg "https://images.pexels.com/photos/8815825/pexels-photo-8815825.jpeg?auto=compress&w=2400"
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-photos
          git commit -m "Temporaire : photos pizzaïolo et régisseur"
          git push
