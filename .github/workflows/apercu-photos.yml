name: Aperçu de photos libres (temporaire)

# Outil temporaire, accepté par Jean-Luc le 2026-11-23 : télécharge en petit des photos Pexels/Unsplash candidates
# (3e série) pour que Claude puisse les regarder avant de les choisir (le cloud ne joint pas ces sites). Retiré avant la fusion.
on:
  push:
    paths:
      - .github/workflows/apercu-photos.yml

permissions:
  contents: write

jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Téléchargement
        run: |
          mkdir -p apercu-photos/r3 && cd apercu-photos/r3
          px() { curl -fsSL -A "Mozilla/5.0" -o "px-$1.jpg" "https://images.pexels.com/photos/$1/pexels-photo-$1.jpeg?auto=compress&cs=tinysrgb&w=500" || echo "échec px $1"; }
          for id in 1563627 6043409 25916399 1485806 3602269 1013518; do px $id; done
          for u in XVTTK3wcYME OZq0qiyoE1o PY_dHgdrcno iP6ZoS0c1Sw; do
            f=$(curl -fsSL -A "Mozilla/5.0" -o "us-$u.jpg" -w '%{url_effective}' "https://unsplash.com/photos/$u/download?w=500" || echo "échec")
            echo "$u $f" >> liste.txt
          done
          ls -la; cat liste.txt
      - name: Enregistrer
        run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-photos
          git commit -m "Aperçu temporaire de photos libres" && git push || echo rien
