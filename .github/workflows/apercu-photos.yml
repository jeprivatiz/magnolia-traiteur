name: Aperçu de photos libres (temporaire)
# 3e série. Outil temporaire accepté par Jean-Luc le 2026-11-23 : télécharge en petit des photos candidates pour les regarder. Retiré avant la fusion.
on:
  push:
    paths:
      - .github/workflows/apercu-photos.yml
permissions:
  contents: write
jobs:
  apercu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        run: |
          mkdir -p apercu-photos
          for id in 34283672 167491 7271793 2177813 38302968 9001997 13740094 34784358 219101 16533282 17056964; do
            curl -sL -o apercu-photos/$id.jpg "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=700" || true
            curl -sL -o /tmp/$id.full "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg" && identify -format "$id %w x %h\n" /tmp/$id.full >> apercu-photos/tailles.txt || true
          done
          cd apercu-photos && montage -label '%t' *.jpg -geometry 340x260+4+4 -tile 4x planche.jpg || true
      - name: Enregistrer
        run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-photos
          git commit -m "Aperçu temporaire de photos libres" && git push || echo rien
