name: Aperçu temporaire de photos (boissons)
on:
  push:
    branches: [claude/project-thread-tz9pmv]
    paths: [.github/workflows/apercu-photos.yml]
permissions:
  contents: write
jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les candidates (sangria)
        run: |
          mkdir -p apercu-photos/sangria && cd apercu-photos/sangria
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -fsSL -A "$UA" -o burst-page.html "https://www.shopify.com/stock-photos/photos/red-white-sangria" || echo "échec page burst"
          grep -o 'https://burst.shopifycdn.com/photos/[^"?]*' burst-page.html | sort -u | head -5 > burst-urls.txt || true
          cat burst-urls.txt
          i=0; for u in $(cat burst-urls.txt); do i=$((i+1)); curl -fsSL -A "$UA" -o "burst$i.jpg" "$u?width=700" || echo "échec $u"; done
          for s in dgiJ0EdpPFM QEccecQYks8 gfJ_5-5e0wU Ye7_hQ_-S7o; do
            curl -fsSL -A "$UA" -o "u-$s.html" "https://unsplash.com/photos/$s" || { echo "échec page $s"; continue; }
            u=$(grep -o 'https://images.unsplash.com/photo-[0-9a-f-]*' "u-$s.html" | head -1); echo "$s -> $u"
            [ -n "$u" ] && curl -fsSL -o "u-$s.jpg" "$u?w=700" && echo "$s $u" >> unsplash.txt
          done
          rm -f *.html; ls -la; cat unsplash.txt || true
      - name: Enregistrer
        run: |
          git config user.name "magnolia-bot"; git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-photos; git commit -m "Temporaire : aperçus sangria" && git push
