name: Aperçu photos (temporaire)
on:
  push:
    branches: [claude/project-thread-27zurf]
    paths: [.github/workflows/apercu-photos.yml]
permissions:
  contents: write
jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les candidates
        shell: bash {0}
        run: |
          mkdir -p apercu-photos/px2 apercu-photos/rom2
          cd apercu-photos/px2
          for id in 7263013 9875788 27583257 1132047 939040 37223904 8119715 1171170 4686833 34802628 32570489 19543937 16461655 4252560 4686825; do
            curl -fsSL -A "Mozilla/5.0" -o "$id.jpg" "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=500" || echo "échec $id"
          done
          cd ../rom2
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          pages="https://www.laromainville.fr/14-pieces-montees-classiques https://www.laromainville.fr/tartes/2113-58984-tarte-chocolat.html https://www.laromainville.fr/fraisiers/1987-58475-framboisier-paques.html https://www.laromainville.fr/cocktails-sucres/153-51765-petits-fours-sucres.html https://www.laromainville.fr/218-fraisiers"
          : > produits.txt
          for p in $pages; do
            curl -fsSL -A "$UA" "$p" -o page.html || { echo "échec $p"; continue; }
            grep -oE 'https://www\.laromainville\.fr/[a-z0-9-]+/[0-9]+-[0-9-]*[a-z0-9-]+\.html' page.html | grep -E "romantica|elegance|bella|tarte-chocolat|framboisier-paques|petits-fours|fraisier" >> produits.txt || true; echo "$p" >> produits.txt
          done
          sort -u produits.txt -o produits.txt; wc -l produits.txt
          : > images.txt
          while read u; do
            curl -fsSL -A "$UA" "$u" -o prod.html || continue
            t=$(grep -oE '<title>[^<]*' prod.html | head -1 | sed 's/<title>//')
            grep -oE 'https://www\.laromainville\.fr/[0-9]+-[a-z_]+/[a-z0-9-]+\.jpg' prod.html | sed -E 's#/([0-9]+)-[a-z_]+/#/\1-default_xl/#' | sort -u | while read i; do echo "$i|$u|$t" >> images.txt; done
          done < produits.txt
          n=0
          while IFS='|' read i u t; do n=$((n+1)); curl -fsSL -A "$UA" -o "r$n.jpg" "$i" && echo "r$n|$i|$u|$t" >> index.txt; done < <(sort -u images.txt | awk -F"|" "!s[\$1]++" | head -100)
          ls | wc -l; wc -l index.txt || true
      - name: Enregistrer
        shell: bash {0}
        run: |
          git config user.name "magnolia-bot"; git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-photos; git commit -m "Aperçu photos (temporaire)"; git push
