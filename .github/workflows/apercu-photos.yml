name: Aperçu temporaire de photos (boissons)
on:
  push:
    branches: [claude/project-thread-tz9pmv]
    paths: [.github/workflows/apercu-photos.yml]
permissions:
  contents: write
jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sangria en grand (Burst by Shopify, licence libre)
        run: |
          mkdir -p public/site/c/boissons
          curl -fsSL -A "Mozilla/5.0" -o /tmp/s.jpg "https://burst.shopifycdn.com/photos/red-white-sangria.jpg?width=1600"
          pip install --quiet pillow
          python3 -c "from PIL import Image; im=Image.open('/tmp/s.jpg').convert('RGB'); print(im.size); im.thumbnail((1600,1600)); im.save('public/site/c/boissons/sangria-maison.webp','WEBP',quality=82)"
      - name: Enregistrer
        run: |
          git config user.name "magnolia-bot"; git config user.email "magnolia-bot@users.noreply.github.com"
          git add public/site/c/boissons; git commit -m "Photo de la sangria (Burst by Shopify)" && git push
