name: Aperçu photos (temporaire)
on:
  push:
    branches: [claude/project-thread-27zurf]
    paths: [.github/workflows/apercu-photos.yml]
permissions:
  contents: write
jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fiches du partenaire
        shell: bash {0}
        run: |
          mkdir -p apercu-photos/cp2 && cd apercu-photos/cp2
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          for s in corbeille-de-saison corbeille-exotique corbeille-fruits-fleurs-cadeaux corbeille-prestige gourmande plateau-de-fruits-secs; do
            curl -fsSL -A "$UA" "https://corbeillesparis.fr/produit/$s/" -o "$s.html"; echo "$s $?"
            grep -oE 'https://corbeillesparis\.fr/wp-content/uploads/[^"'"'"' ]+\.(jpe?g|png|webp)' "$s.html" | grep -vE -- '-[0-9]+x[0-9]+\.' | sort -u > "$s.imgs"
            n=0; while read u; do n=$((n+1)); [ $n -gt 8 ] && break; curl -fsSL -A "$UA" -o "$s-$n.${u##*.}" "$u" && echo "$s-$n $u" >> index.txt; done < "$s.imgs"
          done
          ls | head -80
      - name: Enregistrer
        shell: bash {0}
        run: |
          git config user.name "magnolia-bot"; git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-photos; git commit -m "Aperçu photos (temporaire)"; git push
