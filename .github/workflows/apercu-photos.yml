name: Aperçu de photos libres (temporaire)

# Outil temporaire (méthode acceptée par Jean-Luc le 2026-11-23) : télécharge les photos Pexels des fiches
# fruits de mer pour les détourer sur fond blanc (le cloud ne joint pas Pexels). Retiré avant la fusion.
on:
  push:
    branches: [claude/project-thread-f3rcgg]
    paths:
      - .github/workflows/apercu-photos.yml

permissions:
  contents: write

jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Téléchargement
        run: |
          mkdir -p apercu-photos
          for id in 14387795 14062144 566344 725992; do
            curl -sfL -o apercu-photos/p$id.jpg "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=2000" || echo "echec $id"
          done
          ls -la apercu-photos
      - name: Enregistrer
        run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-photos
          git commit -m "Aperçu temporaire de photos libres" && git push || echo rien
