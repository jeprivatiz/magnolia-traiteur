name: Fabriquer la brochure PDF

# Fabrique public/magnolia-traiteur-brochure.pdf à partir de la page /brochure du site en ligne
# (photos et fiches du back-office), puis l'enregistre dans le dépôt.
# Se lance à la main (onglet Actions › « Run workflow ») : à refaire après de gros changements de catalogue,
# ou le jour de la bascule avec l'adresse des QR codes = https://magnoliatraiteur.fr
on:
  workflow_dispatch:
    inputs:
      site:
        description: Site à photographier
        required: false
        default: https://magnolia-traiteur-production.up.railway.app
      qr:
        description: Adresse des QR codes
        required: false
        default: https://magnolia-traiteur-production.up.railway.app

permissions:
  contents: write

concurrency:
  group: fabriquer-brochure
  cancel-in-progress: false

jobs:
  brochure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Outils (navigateur, Ghostscript)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Fabrication du PDF
        run: node scripts/brochure-pdf.js "${{ github.event.inputs.site || 'https://magnolia-traiteur-production.up.railway.app' }}" "${{ github.event.inputs.qr || 'https://magnolia-traiteur-production.up.railway.app' }}"
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add public/magnolia-traiteur-brochure.pdf
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Brochure PDF refaite depuis le site"
          git pull --rebase
          git push
