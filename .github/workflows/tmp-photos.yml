name: Photos alcools (temporaire)
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ .github/workflows/tmp-photos.yml ]
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-photos; cd tmp-photos
          for i in 17722186 32995841; do curl -fsSL -A "Mozilla/5.0" -o p$i.jpg "https://images.pexels.com/photos/$i/pexels-photo-$i.jpeg?auto=compress&cs=tinysrgb&w=1600"; done; ls -la
          cd ..; git config user.name magnolia-bot; git config user.email magnolia-bot@users.noreply.github.com
          git add tmp-photos; git commit -m "Photos alcools candidates"; git push
