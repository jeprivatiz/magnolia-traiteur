name: Récupérer les avis de magnoliatraiteur.fr

# Copie les avis clients et les logos du site actuel magnoliatraiteur.fr dans le dépôt.
# Se lance à la main (onglet Actions › « Run workflow ») ou quand le script change.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Adresse du site actuel
        required: false
        default: https://www.magnoliatraiteur.fr
  push:
    paths:
      - scripts/recuperer-avis.js
      - .github/workflows/recuperer-avis.yml

permissions:
  contents: write

concurrency:
  group: recuperer-avis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupération
        run: node scripts/recuperer-avis.js "${{ github.event.inputs.url || 'https://www.magnoliatraiteur.fr' }}"
      - name: Réduire les photos (1200 px)
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageOps
          d = 'public/site/avis'
          for f in os.listdir(d):
              p = os.path.join(d, f)
              if os.path.getsize(p) < 400_000: continue
              try:
                  im = Image.open(p); fmt = im.format
                  if fmt not in ('JPEG', 'MPO', 'PNG') or (fmt != 'MPO' and max(im.size) <= 1200): continue
                  im = ImageOps.exif_transpose(im); im.thumbnail((1200, 1200))
                  if fmt == 'PNG': im.save(p, 'PNG', optimize=True)
                  else: im.convert('RGB').save(p, 'JPEG', quality=80, optimize=True, progressive=True)
              except Exception as e: print(f, e)
          PY
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Avis clients et logos repris de magnoliatraiteur.fr"
          git push
