name: Temporaire - photos brochure 10

on:
  push:
    branches: [claude/project-thread-wrnmqa]
    paths:
      - .github/workflows/tmp-photos10.yml

permissions:
  contents: write

jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-photos && cd tmp-photos
          for id in 6365932 15737808 4279 27969785 6466281 17598964 6466290 19279845 7426472 12808650; do curl -fsSL -A "Mozilla/5.0 (magnolia-recuperation)" -o "$id.jpg" "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1600" || echo "échec $id"; done
          ls -la
      - run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add tmp-photos && git commit -m "tmp photos brochure 10" && git push
