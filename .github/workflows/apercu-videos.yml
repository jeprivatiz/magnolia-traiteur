# TEMPORAIRE : télécharge des vidéos Pexels candidates (buffet chinois) pour les regarder. Retiré avant la fusion.
name: apercu-videos
on:
  push:
    branches: [claude/project-thread-c8e5gj]
    paths: ['.github/workflows/apercu-videos.yml', 'apercu-videos/liste.txt']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick >/dev/null
      - name: Videos
        run: |
          mkdir -p apercu-videos/out
          # liste.txt : nom id url debut longueur
          while read -r nom id url debut long; do
            [ -z "$nom" ] && continue
            [ -f "/tmp/$id.mp4" ] || curl -sSL -A "Mozilla/5.0" -o "/tmp/$id.mp4" "$url"
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/$id.mp4); echo "$nom $id $d s"
            echo "$nom $id duree=$d" >> apercu-videos/out/durees.txt
            ffmpeg -nostdin -v error -y -i /tmp/$id.mp4 -vf "fps=12/$d,scale=320:-2,tile=4x3" -frames:v 1 apercu-videos/out/planche-$nom.jpg || true
            F=1
            ffmpeg -nostdin -v error -y -i /tmp/$id.mp4 -filter_complex "[0:v]scale=800:600:force_original_aspect_ratio=increase,crop=800:600,fps=25,setsar=1,split[x][y];[x]trim=start=$(echo "$debut+$F"|bc):duration=$long,setpts=PTS-STARTPTS[a];[y]trim=start=$debut:duration=$F,setpts=PTS-STARTPTS[b];[a][b]xfade=transition=fade:duration=$F:offset=$(echo "$long-$F"|bc),format=yuv420p[v]" -map "[v]" -an -c:v libx264 -preset slow -crf 26 -movflags +faststart apercu-videos/out/$nom.mp4
            ffmpeg -nostdin -v error -y -i apercu-videos/out/$nom.mp4 -frames:v 1 -q:v 3 apercu-videos/out/$nom.jpg
            ffmpeg -nostdin -v error -y -i apercu-videos/out/$nom.mp4 -vf "fps=6/$long,scale=400:-2,tile=3x2" -frames:v 1 apercu-videos/out/boucle-$nom.jpg
          done < apercu-videos/liste.txt
          ls -la apercu-videos/out
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apercu-videos/out && git commit -m "Temporaire : aperçus des vidéos candidates" && git push
