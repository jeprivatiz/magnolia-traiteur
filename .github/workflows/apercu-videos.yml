name: Vidéo du bandeau cocktail (temporaire)
# TEMPORAIRE : télécharge 2 vidéos libres (Pexels) et en fait le bandeau. À retirer avant la fusion.
on:
  push:
    branches: [ 'claude/**' ]
    paths:
      - apercu-videos/montage.sh
permissions:
  contents: write
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: bash apercu-videos/montage.sh
      - run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-videos public/site/v/bandeaux
          git commit -m "Vidéo du bandeau cocktail" && git pull --rebase && git push
