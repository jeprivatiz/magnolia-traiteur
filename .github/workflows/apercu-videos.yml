name: Apercu videos (temporaire)
on:
  push:
    branches: [claude/project-thread-4ax4lk]
    paths: [.github/workflows/apercu-videos.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-4ax4lk }
      - name: Serie de soiree de gala (Pexels, Joseph Eulo) et danse
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p apercu-danse/src && cd apercu-danse/src
          UA="Mozilla/5.0 (magnolia-apercu)"
          for id in $(seq 12350340 12350385); do
            for v in hd_1920_1080_24fps hd_1920_1080_25fps hd_1920_1080_30fps hd_1080_1920_24fps hd_1080_1920_30fps; do
              u="https://videos.pexels.com/video-files/$id/$id-$v.mp4"
              if curl -fsI -A "$UA" "$u" >/dev/null 2>&1; then curl -fsSL -A "$UA" -o "$id.mp4" "$u" && echo "$id $u" >> ../liens.txt; break; fi
            done
          done
          ls -la; cat ../liens.txt || true
      - name: Planches
        run: |
          cd apercu-danse
          for f in src/*.mp4; do n=$(basename "$f" .mp4)
            ffmpeg -nostdin -loglevel error -y -i "$f" -vf "fps=1/2,scale=240:-2,tile=8x2" -frames:v 1 "planche-$n.jpg" || true
            ffmpeg -nostdin -loglevel error -y -i "$f" -an -vf "scale=-2:1080,fps=25" -c:v libx264 -crf 20 -preset veryfast "red-$n.mp4" || true
          done
          rm -rf src; ls -la
      - name: Enregistrer
        run: |
          git config user.name "magnolia-bot"; git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-danse; git commit -m "Apercus videos danse (temporaire)" && git push
