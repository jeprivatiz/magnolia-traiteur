name: Aperçu vidéos (temporaire)

# Temporaire : télécharge les vidéos Pexels candidates, fait des planches d'images et encode la vidéo choisie.
on:
  push:
    branches: [claude/project-thread-k5o7hn]
    paths:
      - .github/workflows/apercu-videos.yml

permissions:
  contents: write

jobs:
  apercu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Téléchargement, planches et encodage
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p apercu-videos /tmp/src
          dl() { curl -fsSL -A "Mozilla/5.0" -o "/tmp/src/$1.mp4" "$2" || echo "échec $2"; }
          dl 6628025 https://videos.pexels.com/video-files/6628025/6628025-hd_1366_720_25fps.mp4
          dl 5971079 https://videos.pexels.com/video-files/5971079/5971079-hd_1366_720_25fps.mp4
          dl 18019218 https://videos.pexels.com/video-files/18019218/18019218-hd_1280_720_50fps.mp4
          ls -la /tmp/src
          for f in /tmp/src/*.mp4; do
            id=$(basename $f .mp4)
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $f)
            echo "$id durée $d" >> apercu-videos/durees.txt
            ffmpeg -nostdin -v error -i $f -vf "fps=8/$d,scale=320:-2,tile=4x2" -frames:v 1 -y apercu-videos/planche-$id.jpg || true
          done
          ls -la apercu-videos
      - name: Enregistrement
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apercu-videos
          git commit -m "Aperçu vidéos (temporaire)" && git push || echo "rien"
