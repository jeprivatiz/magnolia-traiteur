name: Vidéo vignette barbecue (temporaire)
on:
  push:
    branches: [ 'claude/**' ]
    paths:
      - apercu-videos/montage.sh
permissions:
  contents: write
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: bash apercu-videos/montage.sh
      - run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-videos public/site/v/accueil
          git commit -m "Vidéo vignette barbecue" && git pull --rebase && git push
