# TEMPORAIRE : aperçus de vidéos Pexels candidates (buffet chinois). Retiré avant la fusion.
name: apercu-videos
on:
  push:
    branches: [claude/project-thread-c8e5gj]
    paths: ['.github/workflows/apercu-videos.yml', 'apercu-videos/*.txt']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg imagemagick bc >/dev/null
      - name: Vignettes
        run: |
          mkdir -p apercu-videos/out /tmp/v
          if [ -f apercu-videos/vignettes.txt ]; then
            for id in $(cat apercu-videos/vignettes.txt); do
              curl -sfL -A "Mozilla/5.0" -o /tmp/v/$id.jpg "https://images.pexels.com/videos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=400" || echo "pas de vignette $id"
              [ -s /tmp/v/$id.jpg ] && convert /tmp/v/$id.jpg -resize 400x225^ -gravity center -extent 400x225 -gravity south -fill yellow -undercolor black -pointsize 22 -annotate +0+4 "$id" /tmp/v/l-$id.jpg
            done
            montage /tmp/v/l-*.jpg -tile 4x -geometry +3+3 apercu-videos/out/planche-vignettes.jpg || true
          fi
      - name: Videos
        run: |
          [ -f apercu-videos/liste.txt ] || exit 0
          while read -r nom id debut long; do
            [ -z "$nom" ] && continue
            for res in 1920_1080 2048_1080 1280_720 1080_1920 2160_3840 3840_2160 4096_2160; do for fps in 25 24 30 50 60; do
              [ -s /tmp/$id.mp4 ] && break 2
              curl -sfL -A "Mozilla/5.0" -o /tmp/$id.mp4 "https://videos.pexels.com/video-files/$id/$id-hd_${res}_${fps}fps.mp4" || rm -f /tmp/$id.mp4
              [ -s /tmp/$id.mp4 ] || { curl -sfL -A "Mozilla/5.0" -o /tmp/$id.mp4 "https://videos.pexels.com/video-files/$id/$id-uhd_${res}_${fps}fps.mp4" || rm -f /tmp/$id.mp4; }
            done; done
            [ -s /tmp/$id.mp4 ] || { echo "introuvable $id" >> apercu-videos/out/durees.txt; continue; }
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/$id.mp4)
            echo "$nom $id duree=$d" >> apercu-videos/out/durees.txt
            ffmpeg -nostdin -v error -y -i /tmp/$id.mp4 -vf "fps=12/$d,scale=320:-2,tile=4x3" -frames:v 1 apercu-videos/out/planche-$nom.jpg || true
            [ "$long" = "0" ] && continue
            F=1
            ffmpeg -nostdin -v error -y -i /tmp/$id.mp4 -filter_complex "[0:v]scale=800:600:force_original_aspect_ratio=increase,crop=800:600,fps=25,setsar=1,split[x][y];[x]trim=start=$(echo "$debut+$F"|bc):duration=$long,setpts=PTS-STARTPTS[a];[y]trim=start=$debut:duration=$F,setpts=PTS-STARTPTS[b];[a][b]xfade=transition=fade:duration=$F:offset=$(echo "$long-$F"|bc),format=yuv420p[v]" -map "[v]" -an -c:v libx264 -preset slow -crf 26 -movflags +faststart apercu-videos/out/$nom.mp4
            ffmpeg -nostdin -v error -y -i apercu-videos/out/$nom.mp4 -frames:v 1 -q:v 3 apercu-videos/out/$nom.jpg
          done < apercu-videos/liste.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apercu-videos/out && git commit -m "Temporaire : aperçus des vidéos candidates" && git push
