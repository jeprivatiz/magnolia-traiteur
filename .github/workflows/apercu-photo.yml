name: Photo candidate (temporaire)

# TEMPORAIRE : télécharge les photos libres listées dans apercu-photo/liste.txt. À retirer avant la fusion.
on:
  push:
    branches: [ 'claude/**' ]
    paths:
      - apercu-photo/liste.txt

permissions:
  contents: write

jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger
        run: |
          while read -r nom url; do
            [ -z "$nom" ] && continue
            curl -sSfL -A "Mozilla/5.0" -o "apercu-photo/$nom" "$url"
          done < apercu-photo/liste.txt
      - name: Enregistrer
        run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add apercu-photo
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Photo candidate"
          git pull --rebase && git push
