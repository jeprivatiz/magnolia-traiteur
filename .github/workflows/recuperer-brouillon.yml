name: Récupérer le brouillon Magnolia

# Copie les textes, prix, photos et vidéos du brouillon Railway dans le dépôt.
# Se lance à la main (onglet Actions › « Run workflow ») ou quand le script change.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Adresse du brouillon
        required: false
        default: https://magnolia-dev-39325b26.up.railway.app
  push:
    paths:
      - scripts/recuperer-brouillon.js
      - .github/workflows/recuperer-brouillon.yml

permissions:
  contents: write

concurrency:
  group: recuperer-brouillon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupération
        run: node scripts/recuperer-brouillon.js "${{ github.event.inputs.url || 'https://magnolia-dev-39325b26.up.railway.app' }}"
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Contenu du brouillon : textes, prix, photos et vidéos"
          git push
