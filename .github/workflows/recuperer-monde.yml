name: Récupérer les photos candidates du bandeau Saveurs du monde

# Photos Pexels (licence libre) proposées à Jean-Luc pour le bandeau d'arrivée de Saveurs du monde.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/recuperer-monde.yml

permissions:
  contents: write

jobs:
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Téléchargement (1600 px)
        run: |
          mkdir -p public/site/monde/candidats
          cd public/site/monde/candidats
          dl() { curl -fsSL -A "Mozilla/5.0 (magnolia-recuperation)" -o "$1.jpg" "https://images.pexels.com/photos/$1/pexels-photo-$1.jpeg?auto=compress&cs=tinysrgb&w=1600" || echo "échec $1"; }
          for id in 4262012 19141515 3184191 2433868 3071816 4005229 5728162 12412203 32689477 19386650 6605903 3757729 1640772 18281681 29253462 19119728 4262005 8999080; do dl $id; done
          ls -la
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "magnolia-bot"
          git config user.email "magnolia-bot@users.noreply.github.com"
          git add public/site/monde
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Photos candidates (Pexels) pour le bandeau Saveurs du monde"
          git push
